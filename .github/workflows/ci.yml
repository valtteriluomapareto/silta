name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # weekly run on main catches runner-image and toolchain drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# PRs, the weekly run and manual runs: `scripts/verify.sh full` split in three parallel jobs,
# plus the website build, with `verify` as the required check. A push to main only refills
# the shared caches: with squash merges and the up-to-date rule its tree is the one its PR
# just verified (D19). `changes` picks the jobs a PR or push needs (CONTRIBUTING.md#commands).
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists a PR's files through the API
    # The filter step runs only for PRs and pushes; the weekly and manual runs get 'true'.
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
      website: ${{ steps.filter.outputs.website || 'true' }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed areas
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!website/**'
              - '!.github/workflows/website.yml'
              - '!.github/workflows/website-build.yml'
            website:
              - 'website/**'
              - '.github/workflows/website.yml'
              - '.github/workflows/website-build.yml'
              - '.github/workflows/ci.yml'

  swift:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    runs-on: xcode-27   # GitHub public-preview image with Xcode 27.1 (D18)
    # About 16 minutes with cached prior writers; the weekly run and a run that changes
    # build-prior-writer.sh build every writer from source, about 3.5 minutes each.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh

      - name: Install pinned Swift tools
        run: bash scripts/ci/install-swift-tools.sh

      # build-prior-writer.sh pins the commits and checks each cached binary's stamp
      # (commit, Swift toolchain, SHA-256). On an exact hit, a writer missing from the cache
      # fails the job: the hit is never saved again, so it would be rebuilt on every PR.
      # The weekly run builds them from source.
      - name: Name the prior-writer cache
        if: github.event_name != 'schedule'
        id: prior-writers
        run: bash scripts/ci/prior-writer-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore prior writers
        if: github.event_name != 'schedule'
        id: restore-writers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prior-writers
          key: ${{ steps.prior-writers.outputs.key }}

      - name: Verify (Swift, slow tiers, wall-clock)
        env:
          SILTA_PRIOR_WRITER_CACHE: ${{ github.event_name != 'schedule' && format('{0}/prior-writers', runner.temp) || '' }}
          SILTA_PRIOR_WRITER_CACHE_HIT: ${{ steps.restore-writers.outputs.cache-hit }}
        run: scripts/verify.sh full-swift

      - name: Upload scenario evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenario-evidence
          path: artifacts/scenarios
          if-no-files-found: ignore

  evals:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh

      - name: Verify (offline agent eval replays)
        run: scripts/verify.sh evals

  app:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh
      - name: Verify native app
        run: scripts/verify-app.sh
      - name: Upload app evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-test-evidence
          path: .build/app/run.*/Test.xcresult
          if-no-files-found: ignore

  website:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/website-build.yml

  # A job whose needs failed is skipped, and a skipped required check counts as passing,
  # so this always runs (except on push, which verifies nothing). Each job must succeed,
  # or be skipped because `changes` found nothing for it.
  verify:
    needs: [changes, swift, evals, app, website]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the needed jobs to succeed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WEBSITE: ${{ needs.changes.outputs.website }}
          SWIFT: ${{ needs.swift.result }}
          EVALS: ${{ needs.evals.result }}
          APP: ${{ needs.app.result }}
          SITE: ${{ needs.website.result }}
        run: python3 -B scripts/ci/check_verify_gate.py

  # PRs can read caches saved on main but not each other's, so main keeps the shared
  # prior-writer cache filled: after each merge, and weekly so a runner-image toolchain
  # change refills it before the next merge. On a hit this only looks the key up.
  warm-caches:
    needs: changes
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'push' && needs.changes.outputs.code == 'true')
    runs-on: xcode-27
    timeout-minutes: 45   # a miss builds every pinned writer, about 3.5 minutes each
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # build-prior-writer.sh archives the pinned commits

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh

      - name: Name the prior-writer cache
        id: prior-writers
        run: bash scripts/ci/prior-writer-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Look up prior writers
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prior-writers
          key: ${{ steps.prior-writers.outputs.key }}
          lookup-only: true

      - name: Build prior writers
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          SILTA_PRIOR_WRITER_CACHE: ${{ runner.temp }}/prior-writers
        # Every writer the script pins, so the saved entry can't miss one.
        run: bash scripts/build-prior-writer.sh --all "$(mktemp -d)"

      - name: Save prior writers
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prior-writers
          key: ${{ steps.prior-writers.outputs.key }}
