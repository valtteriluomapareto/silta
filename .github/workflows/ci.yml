name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # weekly full run (slow tiers) on main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: xcode-27   # GitHub public-preview image with Xcode 27.1 (D18)
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh

      - name: Install pinned Swift tools
        run: bash scripts/ci/install-swift-tools.sh

      - name: Verify
        run: |
          mode=quick
          if [[ "${{ github.event_name }}" == "schedule" ]]; then mode=full; fi
          scripts/verify.sh "$mode"

      - name: Upload scenario evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenario-evidence
          path: artifacts/scenarios
          if-no-files-found: ignore
