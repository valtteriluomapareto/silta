name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # weekly run on main catches runner-image and toolchain drift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# PRs, the weekly run and manual runs: `scripts/verify.sh full` split in three parallel jobs,
# plus the website build, with `verify` as the required check. A push to main only refills
# the shared caches: with squash merges and the up-to-date rule its tree is the one its PR
# just verified (D19).
#
# `changes` decides which jobs a PR or push needs: website/ and website.yml changes need only
# the website build, and every other change needs the Swift jobs. Path filters on the
# triggers would leave the required `verify` check missing, so the jobs are skipped here
# instead and `verify` accepts a skip only where `changes` asked for one.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists a PR's files through the API
    outputs:
      code: ${{ steps.result.outputs.code }}
      website: ${{ steps.result.outputs.website }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed areas
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!website/**'
              - '!.github/workflows/website.yml'
            website:
              - 'website/**'
              - '.github/workflows/website.yml'

      # The weekly run and manual runs verify everything.
      - name: Choose jobs
        id: result
        env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ steps.filter.outputs.code }}
          WEBSITE: ${{ steps.filter.outputs.website }}
        run: |
          if [[ "$EVENT" == pull_request || "$EVENT" == push ]]; then
            echo "code=$CODE" >> "$GITHUB_OUTPUT"
            echo "website=$WEBSITE" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "website=true" >> "$GITHUB_OUTPUT"
          fi
          echo "event: $EVENT, code: ${CODE:-forced}, website: ${WEBSITE:-forced}"

  swift:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    runs-on: xcode-27   # GitHub public-preview image with Xcode 27.1 (D18)
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh

      - name: Install pinned Swift tools
        run: bash scripts/ci/install-swift-tools.sh

      # build-prior-writer.sh pins the commits and checks each cached binary's stamp
      # (commit, Swift toolchain, SHA-256). A bad entry is rebuilt but not saved again until
      # the key changes. The weekly run builds them from source.
      - name: Name the prior-writer cache
        if: github.event_name != 'schedule'
        id: prior-writers
        run: bash scripts/ci/prior-writer-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore prior writers
        if: github.event_name != 'schedule'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prior-writers
          key: ${{ steps.prior-writers.outputs.key }}

      - name: Verify (Swift, slow tiers, wall-clock)
        env:
          SILTA_PRIOR_WRITER_CACHE: ${{ github.event_name != 'schedule' && format('{0}/prior-writers', runner.temp) || '' }}
        run: scripts/verify.sh full-swift

      - name: Upload scenario evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenario-evidence
          path: artifacts/scenarios
          if-no-files-found: ignore

  evals:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh

      - name: Verify (offline agent eval replays)
        run: scripts/verify.sh evals

  app:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh
      - name: Verify native app
        run: scripts/verify-app.sh
      - name: Upload app evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-test-evidence
          path: .build/app/run.*/Test.xcresult
          if-no-files-found: ignore

  # The website build, from website.yml. It never deploys from here.
  website:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/website.yml
    with:
      ci: true
    # A ceiling for the called workflow, which declares its deploy job's scopes even
    # though `ci: true` skips that job. The build job itself runs with contents: read.
    permissions:
      contents: read
      pages: write
      id-token: write

  # A job whose needs failed is skipped, and a skipped required check counts as passing,
  # so this always runs (except on push, which verifies nothing). Each job must succeed,
  # or be skipped because `changes` found nothing for it.
  verify:
    needs: [changes, swift, evals, app, website]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the needed jobs to succeed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WEBSITE: ${{ needs.changes.outputs.website }}
          SWIFT: ${{ needs.swift.result }}
          EVALS: ${{ needs.evals.result }}
          APP: ${{ needs.app.result }}
          SITE: ${{ needs.website.result }}
        run: |
          echo "changes: $CHANGES (code: $CODE, website: $WEBSITE)"
          echo "swift: $SWIFT, evals: $EVALS, app: $APP, website: $SITE"
          [[ "$CHANGES" == success ]] || exit 1
          expect() {
            if [[ "$1" == true ]]; then [[ "$2" == success ]]; else [[ "$2" == skipped ]]; fi
          }
          expect "$CODE" "$SWIFT" && expect "$CODE" "$EVALS" && expect "$CODE" "$APP" \
            && expect "$WEBSITE" "$SITE"

  # PRs can read caches saved on main but not each other's, so main keeps the shared
  # prior-writer cache filled: after each merge, and weekly so a runner-image toolchain
  # change refills it before the next merge. On a hit this only looks the key up.
  warm-caches:
    needs: changes
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'push' && needs.changes.outputs.code == 'true')
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # build-prior-writer.sh archives the pinned commits

      - name: Select Xcode
        run: bash scripts/ci/select-xcode.sh

      - name: Name the prior-writer cache
        id: prior-writers
        run: bash scripts/ci/prior-writer-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Look up prior writers
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prior-writers
          key: ${{ steps.prior-writers.outputs.key }}
          lookup-only: true

      - name: Build prior writers
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          SILTA_PRIOR_WRITER_CACHE: ${{ runner.temp }}/prior-writers
        run: |
          out="$(mktemp -d)"
          bash scripts/build-prior-writer.sh "$out/prior" prior
          bash scripts/build-prior-writer.sh "$out/v6" v6

      - name: Save prior writers
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prior-writers
          key: ${{ steps.prior-writers.outputs.key }}
