# SwiftLint: a small, deliberate rule set. CI runs with --strict, so every warning
# fails the build. Formatting is swift-format's job (.swift-format.json); rules that
# fight it are disabled here.

included:
  - Sources
  - Tests
excluded:
  - .build
  - .swiftpm

reporter: "xcode"

# Crash-free shipped code and documented public API (D22, D28). force_try and
# force_cast are on by default; these are opt-in.
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - missing_docs

disabled_rules:
  - trailing_comma        # swift-format decides
  - opening_brace         # swift-format decides
  - todo                  # TODOs are allowed; plan references are caught by scripts/guards

line_length:
  warning: 100            # matches swift-format's lineLength
  error: 140
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

identifier_name:
  min_length:
    warning: 1            # short names such as id, db, i are fine in context

type_name:
  max_length:
    warning: 60
    error: 80

file_length:
  warning: 600
  error: 1000
